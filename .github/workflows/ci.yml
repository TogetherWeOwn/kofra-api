name: ci

# `ci-ok` is the aggregate check required on main: its NAME must stay
# `ci-ok`, and every gating job id must be listed in its `needs`. Actions and
# downloaded tools are pinned by commit SHA or SHA-256. Installs use the
# committed lockfile and run no dependency install scripts except the ones
# allowed in pnpm-workspace.yaml.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  # Merge queue validation: every required check must report on the queue's
  # temporary merge commit.
  merge_group:
  push:
    branches: [main]
  # Nightly full run: catches drift no PR causes (new advisories, runtime).
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

# PR runs cancel superseded runs of the same PR. Every other event gets its
# own group (run id): a shared group would cancel older PENDING runs even
# with cancel-in-progress false.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_INCREMENTAL: '0'
  CARGO_TERM_COLOR: always

jobs:
  # Change detection (org CI standard): which areas a pull request touches.
  # A full-run path (dependency manifests, lockfiles, toolchain and tooling
  # config, workflows) or an unclassified path forces a full run. `contract`
  # runs on every change, because prettier and the F7 deny-list check every
  # file, Markdown included. `rust` runs on a pull request when the `rust`
  # area (the crates, xtask, Cargo files, the toolchain, and the contract
  # sources and artefacts the types are generated from) or a full-run path
  # changed, and always on every other event. `sdk` follows the same rule
  # with the `sdk` area (the SDKs, their generator, the mock they are tested
  # against, and the contract sources and artefacts they are generated from).
  changes:
    name: changes
    uses: TogetherWeOwn/.github/.github/workflows/changes.yml@8059ac2b121b63443db656b1e10e927b8af8133c # v0.12.1
    with:
      areas-json: '{"docs":["**.md","docs/**"],"contract":["openapi/**","errors/**","registry/**","generated/**","tools/**","test/**","migrations/**"],"rust":["crates/**","xtask/**","Cargo.toml","Cargo.lock","rust-toolchain.toml","openapi/**","errors/**","registry/**","tools/build.mjs","generated/**"],"sdk":["sdk/**","tools/sdk/**","tools/mock/**",".node-version","openapi/**","errors/**","registry/**","generated/**"]}'
      full-run-globs-json: '["package.json","**/package.json","pnpm-lock.yaml","**/pnpm-lock.yaml","pnpm-workspace.yaml","**/pnpm-workspace.yaml",".npmrc","**/.npmrc",".node-version","redocly.yaml","eslint.config.js","prettier.config.js",".prettierignore",".gitignore",".gitattributes",".editorconfig","Cargo.toml","**/Cargo.toml","Cargo.lock","**/Cargo.lock",".cargo/**","**/.cargo/**","rust-toolchain*","**/rust-toolchain*","osv-scanner.toml",".gitleaks.toml",".github/**"]'
      docs-areas-json: '["docs"]'

  public-pr-security:
    if: github.event_name == 'pull_request' && github.event.repository.private == false
    # The nested OSV reusable requires this exact permission ceiling: actions
    # reads same-run comparison artifacts, contents reads the PR tree/history,
    # and security-events uploads comparison SARIF. No secrets are passed.
    permissions:
      actions: read # Nested OSV reads same-run comparison artifacts.
      contents: read
      security-events: write # Nested OSV uploads comparison SARIF.
    uses: TogetherWeOwn/.github/.github/workflows/public-pr-security.yml@bfdaf1532e1605281d366186e4ed9e8cfa0113fc # v0.13.0

  workflow-lint:
    name: workflow lint (actionlint, zizmor)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Bump each version together with its SHA-256 from the release's
      # checksum file, never on its own.
      - name: Install actionlint and zizmor
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
          ZIZMOR_VERSION: 1.32.0
          ZIZMOR_SHA256: bb110cc765eca9cd7efb2e284a956be5974c60027b0970f16397d86208a9957b
        run: |
          set -euo pipefail
          a="$RUNNER_TEMP/actionlint.tgz"
          curl -sSfL --connect-timeout 10 --max-time 60 --retry 3 -o "$a" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  ${a}" | sha256sum --check -
          tar -xzf "$a" -C "$RUNNER_TEMP" actionlint
          z="$RUNNER_TEMP/zizmor.tgz"
          curl -sSfL --connect-timeout 10 --max-time 60 --retry 3 -o "$z" \
            "https://github.com/zizmorcore/zizmor/releases/download/v${ZIZMOR_VERSION}/zizmor-x86_64-unknown-linux-gnu.tar.gz"
          echo "${ZIZMOR_SHA256}  ${z}" | sha256sum --check -
          tar -xzf "$z" -C "$RUNNER_TEMP" zizmor
      - name: actionlint
        run: '"$RUNNER_TEMP/actionlint" -shellcheck= -pyflakes='
      - name: zizmor
        run: '"$RUNNER_TEMP/zizmor" --offline --no-config --no-ignores .github/workflows'

  deps:
    name: dependency scan (osv-scanner)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Bump OSV_VERSION together with OSV_SHA256 (from the release's
      # osv-scanner_SHA256SUMS), never on its own.
      - name: Scan the lockfiles for known vulnerabilities
        env:
          OSV_VERSION: 2.7.1
          OSV_SHA256: fb7dab19a8bd9bbe5c3189f09d4b7ee1820c9553a23bac202648a56efd2f6ee8
        run: |
          set -euo pipefail
          bin="$RUNNER_TEMP/osv-scanner"
          curl -sSfL --connect-timeout 10 --max-time 60 --retry 3 -o "$bin" \
            "https://github.com/google/osv-scanner/releases/download/v${OSV_VERSION}/osv-scanner_linux_amd64"
          echo "${OSV_SHA256}  ${bin}" | sha256sum --check -
          chmod 0755 "$bin"
          # osv-scanner reads Go modules from go.mod (go.sum holds only hashes).
          "$bin" scan source --lockfile pnpm-lock.yaml --lockfile Cargo.lock \
            --lockfile sdk/go/go.mod --lockfile sdk/python/uv.lock \
            --lockfile tools/sdk/python/uv.lock

  contract:
    name: contract (build check, lint, tests, F7 deny-list)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The published contract, error pages and catalogue are generated from
      # openapi/ and errors/; a stale generated/ fails here.
      - run: pnpm run build:check
      # prettier, eslint, and redocly lint of the published contract.
      - run: pnpm run lint
      # Contract self-consistency, catalogue, naming registry, mock server, F7.
      - run: pnpm test
      # F7 over every tracked file, generated artefacts included.
      - run: pnpm run f7

  rust:
    name: rust (fmt, clippy, tests, wasm32, types match contract)
    needs: [changes]
    if: github.event_name != 'pull_request' || needs.changes.outputs.full_run == 'true' || fromJSON(needs.changes.outputs.areas).rust
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # rust-toolchain.toml pins the version, components and the wasm32 target.
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo fmt --all --check
      # The Rust types are generated from generated/openapi.json; drift fails.
      - run: cargo run --locked -q -p xtask -- check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo clippy --locked -p kofra-api-types -p kofra-api-core -p kofra-account --all-targets --target wasm32-unknown-unknown -- -D warnings
      - run: cargo test --locked --workspace
      # The contract-derived types, the API core and the account service must
      # build for the Workers target.
      - run: cargo build --locked -p kofra-api-types -p kofra-api-core -p kofra-account --target wasm32-unknown-unknown --release

  sdk:
    name: sdk (regenerate, TypeScript, Python, Go, CLI cross-build)
    needs: [changes]
    if: github.event_name != 'pull_request' || needs.changes.outputs.full_run == 'true' || fromJSON(needs.changes.outputs.areas).sdk
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: sdk/go/go.mod
          cache-dependency-path: sdk/go/go.sum
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: pnpm install --frozen-lockfile
      # The SDKs' generated layers and the CLI table come from the contract
      # with pinned generators; any drift or stray file fails here.
      - name: Regenerate the SDKs and fail on drift
        run: |
          set -euo pipefail
          node tools/sdk/generate.mjs
          git diff --exit-code
          untracked="$(git status --porcelain)"
          if [ -n "$untracked" ]; then
            echo "Files changed or added by the generator:"
            echo "$untracked"
            exit 1
          fi
      - name: TypeScript (typecheck, tests against the mock)
        working-directory: sdk/typescript
        run: |
          pnpm run check
          pnpm test
      - name: Python (tests against the mock)
        working-directory: sdk/python
        run: uv run --locked pytest
      - name: Go (vet, gofmt, tests against the mock)
        working-directory: sdk/go
        run: |
          set -euo pipefail
          go vet ./...
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "gofmt would change: $unformatted"
            exit 1
          fi
          go test ./...
      - name: Cross-build the CLI
        working-directory: sdk/go
        env:
          CGO_ENABLED: '0'
        run: |
          set -euo pipefail
          for os in linux darwin windows; do
            for arch in amd64 arm64; do
              GOOS="$os" GOARCH="$arch" go build -trimpath -o "$RUNNER_TEMP/kofra-$os-$arch" ./cmd/kofra
            done
          done

  ci-ok:
    name: ci-ok
    needs: [changes, public-pr-security, workflow-lint, deps, contract, rust, sdk]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: |
          # Fail closed. `changes` must succeed. The PR-only security caller
          # must succeed on pull_request and be skipped on any other event.
          # `rust` must succeed when its gate says it is due (any event other
          # than pull_request, a full run, or a change in the `rust` area) and
          # be skipped otherwise; `sdk` likewise with the `sdk` area. Every
          # other job must succeed.
          if ! jq -e --arg event "$CI_EVENT_NAME" '
            . as $n |
            ($event != "pull_request" or
              $n.changes.outputs.full_run == "true" or
              ($n.changes.outputs.areas | fromjson | .rust == true)) as $rust_due |
            ($event != "pull_request" or
              $n.changes.outputs.full_run == "true" or
              ($n.changes.outputs.areas | fromjson | .sdk == true)) as $sdk_due |
            ($n | length) > 1 and
            $n.changes.result == "success" and
            $n["public-pr-security"].result == (if $event == "pull_request" then "success" else "skipped" end) and
            $n.rust.result == (if $rust_due then "success" else "skipped" end) and
            $n.sdk.result == (if $sdk_due then "success" else "skipped" end) and
            ($n | del(.["public-pr-security"], .rust, .sdk) | all(.[]; .result == "success"))
          ' <<< "$NEEDS_JSON" > /dev/null; then
            echo "ci-ok: a required job did not succeed"
            exit 1
          fi
          echo "ci-ok: all required jobs passed"
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          CI_EVENT_NAME: ${{ github.event_name }}
