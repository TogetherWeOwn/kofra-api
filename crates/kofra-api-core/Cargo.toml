[package]
name = "kofra-api-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "The Kofra API request pipeline and handlers, independent of the runtime: authentication, scopes and roles, problem details, request IDs, idempotency, pagination, rate limits and the audit log."

[dependencies]
base64 = "0.23"
hmac = "0.12"
kofra-api-types = { path = "../kofra-api-types" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_path_to_error = "0.1"
sha2 = "0.10"
subtle = "2.6"
time = { version = "0.3", features = ["formatting", "macros", "parsing"] }

[dev-dependencies]
pollster = "0.4"

[lints]
workspace = true
