[package]
name = "kofra-storage-mgmt"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "The storage port served by the storage management plane: requests, token classes, name resolution, idempotency keys, shapes and error codes, independent of the runtime."

[dependencies]
kofra-account = { path = "../kofra-account" }
kofra-api-core = { path = "../kofra-api-core" }
kofra-api-types = { path = "../kofra-api-types" }
# The management plane's wire contract: a checked copy (crates/mgmt-types,
# pinned by its PIN file).
mgmt-types = { path = "../mgmt-types" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
pollster = "0.4"

[lints]
workspace = true
