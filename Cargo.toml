[workspace]
resolver = "3"
members = ["crates/kofra-account", "crates/kofra-store", "crates/kofra-storage-mgmt", "crates/mgmt-types", "workers/kofra-api", "crates/kofra-api-types", "crates/kofra-api-core", "xtask"]

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/TogetherWeOwn/kofra-api"
rust-version = "1.98"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
