[package]
name = "kofra-api-worker"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "The Kofra API on Cloudflare Workers: the shell around kofra-api-core and kofra-account, on D1 and the Email Service."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
futures-util = { version = "0.3", default-features = false, features = ["std"] }
hkdf = "0.12"
hmac = "0.12"
kofra-account = { path = "../../crates/kofra-account" }
kofra-api-core = { path = "../../crates/kofra-api-core" }
kofra-api-types = { path = "../../crates/kofra-api-types" }
kofra-store = { path = "../../crates/kofra-store" }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
# worker-build 0.8.7 (the [build] command in wrangler.toml) matches this.
worker = { version = "=0.9.0", features = ["d1"] }

[dev-dependencies]
pollster = "0.4"

[lints]
workspace = true
