# Kofra API error catalogue: the single source for every error code.
#
# Rules (enforced by test/catalogue.test.mjs):
# - `code` is the stable machine name. It never changes inside /v1.
# - `title` and `detail_example` may be reworded at any time.
# - `hint` is one sentence that tells a reader of this response alone what to do next.
# - `retryable: true` only for answers a client may repeat unchanged (with Retry-After when given).
# - Busy answers are always 429 or 503; a 500 is never the answer for a temporary condition.
# - Every code gets a documentation page (generated/docs/errors/<code>.md).
#
# Fields: code, status, title, retryable, meaning (docs page text), hint, detail_example.

errors:
  # 400
  - code: validation_failed
    status: 400
    title: Request is not valid
    retryable: false
    meaning: One or more request fields, path parameters or query parameters do not match the API description. The `errors` list names each field with a JSON pointer.
    hint: Fix each field listed in `errors` (the `pointer` names it), then send the request again.
    detail_example: 'The request has 1 invalid field.'
  - code: unknown_field
    status: 400
    title: Request has a field the API does not know
    retryable: false
    meaning: The request body has a field, or the query has a parameter, that the operation does not accept. Unknown fields and parameters are refused so that a misspelt one never silently does nothing.
    hint: Remove or correct the field or parameter named by `errors[].pointer`; the API reference lists what each operation accepts.
    detail_example: 'The field "/nmae" is not accepted by this operation.'
  - code: invalid_bucket_name
    status: 400
    title: Bucket name is not valid
    retryable: false
    meaning: Bucket names are 3 to 63 characters of lowercase letters, digits and hyphens, and start and end with a letter or digit.
    hint: Choose a name of 3 to 63 lowercase letters, digits or hyphens that starts and ends with a letter or digit.
    detail_example: 'The bucket name "My_Photos" contains characters that are not allowed.'
  - code: invalid_cursor
    status: 400
    title: Cursor is not valid
    retryable: false
    meaning: The `cursor` value was not returned by this operation, was changed, or has expired.
    hint: Start again without `cursor`, then pass only the `next_cursor` values the API returns.
    detail_example: 'The cursor is not valid for this list.'

  # 401
  - code: unauthenticated
    status: 401
    title: Authentication required
    retryable: false
    meaning: The request has no `Authorization` header, or the bearer token in it is not a valid Kofra API token.
    hint: 'Send `Authorization: Bearer <token>` with an API token from the console (Account, API tokens).'
    detail_example: 'The request has no valid bearer token.'
  - code: token_expired
    status: 401
    title: API token has expired
    retryable: false
    meaning: The API token was valid but has passed its expiry time.
    hint: Create a new API token in the console and use it in place of the expired one.
    detail_example: 'The API token expired at 2026-11-01T00:00:00Z.'

  # 403
  - code: insufficient_scope
    status: 403
    title: Token lacks a required scope
    retryable: false
    meaning: The API token is valid but does not carry the scope this operation needs. The scopes needed are listed in the operation's description.
    hint: Use a token that has the scope named in `detail`, or create one with that scope in the console.
    detail_example: 'This operation needs the scope "buckets:write".'
  - code: ip_not_allowed
    status: 403
    title: Request address is not allowed for this token
    retryable: false
    meaning: The API token is limited to some client addresses (`allowed_ips`), and this request came from another address. When a token is being created, an address list wider than the creating token's own is refused the same way.
    hint: Send the request from an address in the token's `allowed_ips`, or use a token whose list includes this address.
    detail_example: 'The token is not accepted from 198.51.100.7.'
  - code: bucket_not_allowed
    status: 403
    title: Token is limited to other buckets
    retryable: false
    meaning: The API token is limited to some buckets (`buckets`), and the request names a bucket outside that list. When a token or an access key is being created, a bucket outside the creating token's list is refused the same way. Storage refuses the same way a grant wider than the acting member's own access, or an object request on a bucket the member has no access to.
    hint: Use a token whose `buckets` list includes this bucket, or a token without a bucket limit; if the token has no bucket limit, ask an Owner for access to the bucket.
    detail_example: 'The token is limited to other buckets than "photos".'
  - code: role_forbidden
    status: 403
    title: Your role does not allow this
    retryable: false
    meaning: The token has the scope, but the member it belongs to has a workspace role that does not allow the operation. Effective permission is the token's scopes limited by the member's role.
    hint: Ask a workspace Owner or Admin to change your role, or to perform the operation.
    detail_example: 'The Viewer role cannot create buckets.'
  - code: account_read_only
    status: 403
    title: Account is read-only
    retryable: false
    meaning: The account is suspended in read-only mode. Reads, lists and deletes work; anything that adds data or credentials is refused.
    hint: Resolve the reason shown under Account in the console (often a payment); writes work again as soon as the account is active.
    detail_example: 'The account is read-only, so new buckets cannot be created.'
  - code: account_unavailable
    status: 403
    title: Account is not available
    retryable: false
    meaning: The account is blocked or is being deleted. Storage operations and new API tokens are refused; reading the account, cancelling a deletion, listing and revoking API tokens and reading the audit log still work.
    hint: Open Account in the console to see the reason; a deletion can be cancelled there or with POST /v1/account/deletion/cancel.
    detail_example: 'The account is being deleted.'

  # 404
  - code: not_found
    status: 404
    title: No such endpoint
    retryable: false
    meaning: The path does not name an operation of this API version.
    hint: Check the path against the API reference at https://api.kofra.app/openapi.json.
    detail_example: 'There is no operation at this path.'
  - code: bucket_not_found
    status: 404
    title: Bucket not found
    retryable: false
    meaning: The workspace has no bucket with this name.
    hint: List your buckets with GET /v1/buckets and use one of the returned names.
    detail_example: 'There is no bucket named "photos" in this workspace.'
  - code: key_not_found
    status: 404
    title: Access key not found
    retryable: false
    meaning: The workspace has no active access key with this ID. Revoked keys are removed, so a second revoke of the same key also answers this code.
    hint: List your access keys with GET /v1/keys and use one of the returned IDs.
    detail_example: 'There is no active access key with this ID.'

  # 405, 413, 415
  - code: token_not_found
    status: 404
    title: API token not found
    retryable: false
    meaning: No API token with this ID exists in the workspace that you can manage, or it has been revoked.
    hint: List your API tokens with GET /v1/tokens and use one of the returned IDs.
    detail_example: 'No API token "tok_01jd3p5d9v1n6z8r0t2v4x6y8a" exists.'
  - code: method_not_allowed
    status: 405
    title: Method not allowed
    retryable: false
    meaning: The path exists, but not with this HTTP method. The `Allow` header lists the methods it accepts.
    hint: Use one of the methods in the `Allow` header.
    detail_example: 'PUT is not allowed on /v1/buckets.'
  - code: payload_too_large
    status: 413
    title: Request body is too large
    retryable: false
    meaning: Management requests carry small JSON bodies. Object data is never sent to this API; it goes to the S3 endpoint.
    hint: Send a smaller body; upload object data through the S3 endpoint or a presigned URL instead.
    detail_example: 'The request body is larger than 64 KiB.'
  - code: unsupported_media_type
    status: 415
    title: Body must be JSON
    retryable: false
    meaning: Request bodies must be sent as `application/json`.
    hint: 'Send the body as JSON with the header `Content-Type: application/json`.'
    detail_example: 'The body was sent as text/plain.'

  # 409
  - code: bucket_already_exists
    status: 409
    title: Bucket already exists
    retryable: false
    meaning: The workspace already has a bucket with this name.
    hint: Choose another name, or use the existing bucket.
    detail_example: 'A bucket named "photos" already exists.'
  - code: bucket_not_empty
    status: 409
    title: Bucket is not empty
    retryable: false
    meaning: A bucket can be deleted only when it holds no objects. Objects are deleted through the S3 endpoint.
    hint: Delete every object in the bucket with your S3 tool, then delete the bucket again.
    detail_example: 'Bucket "photos" still holds 1,204 objects.'
  - code: key_limit_reached
    status: 409
    title: Too many active access keys
    retryable: false
    meaning: A workspace can have at most 20 active access keys at once.
    hint: Revoke an access key you no longer use with DELETE /v1/keys/{key_id}, then create the new one.
    detail_example: 'The workspace already has 20 active access keys.'
  - code: bucket_limit_reached
    status: 409
    title: Too many buckets
    retryable: false
    meaning: A workspace can have at most 10,000 buckets, counting buckets that are still being deleted.
    hint: Delete a bucket you no longer use, then create the new one.
    detail_example: 'The workspace already has 10,000 buckets.'
  - code: upload_limit_reached
    status: 409
    title: Too many uploads in progress
    retryable: false
    meaning: The workspace has as many uploads in progress as it may have at once; the usage answer shows the limit (`open_uploads`).
    hint: Complete or abort an upload in progress, then start the new one.
    detail_example: 'The workspace already has the most uploads in progress it may have.'
  - code: grant_narrowing_refused
    status: 409
    title: Access can only be widened
    retryable: false
    meaning: An access key's permission on a bucket can be added or widened (from read to read_write), never narrowed. A narrowed grant could silently become wide again after a recovery, so narrowing is refused.
    hint: Create a new key with the narrower access, move your tools to it, then revoke the old key.
    detail_example: 'The key has read_write on "photos"; it cannot be narrowed to read.'
  - code: grant_limit_reached
    status: 409
    title: Too many grants on one key
    retryable: false
    meaning: An access key can hold grants on at most 32 buckets.
    hint: Create a second access key for the remaining buckets.
    detail_example: 'The key already has grants on 32 buckets.'
  - code: deletion_already_requested
    status: 409
    title: Deletion already requested
    retryable: false
    meaning: The account already has a deletion in progress or awaiting confirmation.
    hint: Read GET /v1/account to see the deletion and its dates; cancel it with POST /v1/account/deletion/cancel if it was a mistake.
    detail_example: 'A deletion of this account was requested at 2026-11-19T10:00:00Z.'
  - code: deletion_not_requested
    status: 409
    title: No deletion to cancel
    retryable: false
    meaning: The account has no deletion in progress, so there is nothing to cancel.
    hint: No action is needed; the account is not being deleted.
    detail_example: 'This account has no deletion in progress.'
  - code: deletion_final
    status: 409
    title: Deletion can no longer be cancelled
    retryable: false
    meaning: The deletion has passed its last cancellation time. Deleted data is cryptographically erased (its encryption key is destroyed), so it can never be read again.
    hint: No action can restore this data; contact support with the `request_id` if you believe this is wrong.
    detail_example: 'The deletion became final at 2026-12-19T10:00:00Z.'
  - code: deletion_not_cancellable
    status: 409
    title: Deletion cannot be cancelled here
    retryable: false
    meaning: The deletion was not started by a member of the account (for example, it was started for non-payment), so it cannot be cancelled through the API or the console.
    hint: Contact support with the `request_id` to resolve what started the deletion.
    detail_example: 'This deletion was not requested by a member of the account.'
  - code: feed_reset
    status: 409
    title: Event feed was reset
    retryable: false
    meaning: The event feed was rebuilt, so cursors issued before the rebuild no longer apply. Some events may not appear in the new feed.
    hint: Re-read the current state (GET /v1/account, /v1/keys, /v1/usage), then read the feed again without a cursor.
    detail_example: 'The cursor belongs to an earlier event feed.'
  - code: idempotency_key_in_use
    status: 409
    title: Same request is still running
    retryable: true
    meaning: A request with this `Idempotency-Key` is still being processed.
    hint: Wait for the number of seconds in `Retry-After`, then send the identical request again with the same key.
    detail_example: 'A request with this Idempotency-Key is still in progress.'

  # 422
  - code: idempotency_key_reused
    status: 422
    title: Idempotency key used with another request
    retryable: false
    meaning: An `Idempotency-Key` is bound to the first request sent with it for 24 hours, that is to its method, path, query and body. The same key with a different method, path, query or body is refused, so `dry_run=true` and the same request without it need different keys (`dry_run=false` and an omitted `dry_run` are the same request).
    hint: Use a new Idempotency-Key for a different request; reuse a key only to repeat the identical request.
    detail_example: 'This Idempotency-Key was first used with a different body.'

  # 429
  - code: rate_limited
    status: 429
    title: Too many requests
    retryable: true
    meaning: The credential or workspace has used up its request allowance for now. The `RateLimit` and `RateLimit-Policy` headers describe the limit that applied.
    hint: Wait for the number of seconds in `Retry-After`, then retry; spread requests out to stay under the limit.
    detail_example: 'Write requests are limited to 2 per second.'

  # 500, 503
  - code: internal_error
    status: 500
    title: Internal error
    retryable: false
    meaning: The request failed for a reason that is not one of the codes above. No detail of the cause is returned.
    hint: Contact support and quote the `request_id`; repeating the same request is not expected to help.
    detail_example: 'The request could not be completed.'
  - code: service_unavailable
    status: 503
    title: Service is busy
    retryable: true
    meaning: The service is temporarily busy or a dependency is briefly unavailable. Nothing was changed.
    hint: Wait for the number of seconds in `Retry-After`, then send the same request again.
    detail_example: 'The service is busy; try again shortly.'
